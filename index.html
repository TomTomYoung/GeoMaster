<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoMaster</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e2e8f0; color: #0f172a; }
    button, input, textarea { font: inherit; }
    .app { display: grid; grid-template-rows: 58px 1fr; width: 100%; height: 100%; }
    header { display: flex; align-items: center; gap: 18px; padding: 0 18px; background: #0f172a; color: white; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
    header p { margin: 0; color: #94a3b8; font-size: 13px; }
    main { min-height: 0; display: grid; grid-template-columns: 190px minmax(0, 1fr) 280px; gap: 1px; background: #cbd5e1; }
    aside { min-height: 0; overflow: auto; background: white; padding: 14px; }
    .canvas-wrap { min-width: 0; min-height: 0; position: relative; background: #f8fafc; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    h2 { margin: 4px 0 10px; font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }
    .tool-list { display: grid; gap: 7px; }
    .tool, .action { border: 1px solid #cbd5e1; background: white; color: #0f172a; border-radius: 8px; padding: 9px 10px; text-align: left; cursor: pointer; }
    .tool:hover, .action:hover { border-color: #64748b; }
    .tool.active { background: #2563eb; border-color: #2563eb; color: white; }
    .section { margin-bottom: 20px; }
    .switch { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
    .actions { display: grid; gap: 7px; }
    .status { position: absolute; left: 14px; bottom: 14px; background: rgb(15 23 42 / .88); color: white; border-radius: 8px; padding: 8px 11px; font-size: 12px; pointer-events: none; }
    textarea { width: 100%; min-height: 320px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .meta { font-size: 13px; color: #475569; margin-bottom: 10px; }
    @media (max-width: 850px) { main { grid-template-columns: 150px 1fr; } .right { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>GeoMaster</h1>
      <p>HTML + JavaScript geometry workbench</p>
    </header>
    <main>
      <aside>
        <section class="section">
          <h2>Tools</h2>
          <div class="tool-list">
            <button class="tool active" data-tool="point" data-label="Point">Point</button>
            <button class="tool" data-tool="segment" data-label="Segment">Segment</button>
            <button class="tool" data-tool="line" data-label="Line">Line</button>
            <button class="tool" data-tool="ray" data-label="Ray">Ray</button>
            <button class="tool" data-tool="circle" data-label="Circle">Circle</button>
            <button class="tool" data-tool="pan" data-label="Pan">Pan</button>
          </div>
        </section>
        <section class="section">
          <h2>View</h2>
          <label class="switch"><input id="toggle-grid" type="checkbox" checked> Grid</label>
          <label class="switch"><input id="toggle-snap" type="checkbox" checked> Snap</label>
        </section>
        <section class="section">
          <h2>Actions</h2>
          <div class="actions">
            <button class="action" id="undo">Undo</button>
            <button class="action" id="reset-view">Reset view</button>
            <button class="action" id="clear">Clear</button>
          </div>
        </section>
      </aside>
      <div class="canvas-wrap">
        <canvas id="geometry-canvas"></canvas>
        <div class="status">Tool: <span id="status">Point</span> · wheel: zoom · right/middle drag: pan</div>
      </div>
      <aside class="right">
        <h2>Scene</h2>
        <div class="meta">Objects: <strong id="object-count">0</strong></div>
        <textarea id="json-output" readonly></textarea>
        <button class="action" id="copy-json" style="width:100%;margin-top:8px">Copy JSON</button>
      </aside>
    </main>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
